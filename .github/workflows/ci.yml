name: Check content and graph

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Content checklist, graph integrity and tests
        run: npm run check
      - name: Syntax check site scripts
        run: |
          node --check assets/atlas.js
          node --check assets/knowledge.js
          node --check assets/theme.js
          node --check data/catalog.js
