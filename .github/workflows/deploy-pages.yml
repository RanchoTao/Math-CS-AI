name: Deploy Math-CS-AI Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html styles.css tower-graph.css app-v4.js .nojekyll _site/
          cp -R data styles _site/

      - name: Validate static site
        run: |
          test -s _site/index.html
          test -s _site/styles.css
          test -s _site/tower-graph.css
          test -s _site/app-v4.js
          test -s _site/data/catalog.js
          test -s _site/data/catalog.part5.js
          test -s _site/styles/base.css
          test -s _site/styles/graph.css
          node --check _site/app-v4.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
