name: Deploy Math-CS-AI Atlas to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate graph and knowledge content
        run: |
          node scripts/validate-content.mjs
          node --test tests/knowledge-content.test.mjs

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html knowledge.html .nojekyll _site/
          cp -R assets data content schemas _site/

      - name: Validate static site
        run: |
          for f in index.html knowledge.html assets/base.css assets/atlas.css assets/atlas.js assets/knowledge.css assets/knowledge.js \
                   assets/fonts/display-sc.woff2 assets/fonts/instrument-serif.woff2 data/catalog.json data/catalog.js \
                   content/manifest.json content/courses/manifest.json content/experiences/manifest.json; do
            test -s "_site/$f" || { echo "missing $f"; exit 1; }
          done
          node --check _site/assets/atlas.js
          node --check _site/assets/knowledge.js
          node --check _site/data/catalog.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
