<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="纯数学、计算机科学与人工智能多尺度知识图谱" />
  <title>数学·计算机·人工智能知识图谱</title>
  <link rel="stylesheet" href="./styles.css?v=20260806-0145" />
  <link rel="stylesheet" href="./virtual-graph.css?v=20260806-0145" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand" id="homeButton" aria-label="返回完整知识图谱">
        <span class="brand-mark">知</span>
        <span>
          <strong>数学·计算机·人工智能知识图谱</strong>
          <small>从基础知识到研究前沿</small>
        </span>
      </button>

      <div class="topbar-actions">
        <div class="search-wrap">
          <label class="search-box">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="搜索知识节点……" autocomplete="off" />
          </label>
          <div id="searchResults" class="search-results" hidden></div>
        </div>
        <a class="github-link" href="https://github.com/RanchoTao/Math-CS-AI" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <aside class="sidebar" aria-label="知识图谱控制器">
        <section>
          <p class="eyebrow">领域</p>
          <div id="domainFilters" class="filter-stack">
            <button class="filter-button active" data-domain="all"><span class="dot all"></span>全部领域</button>
            <button class="filter-button" data-domain="math"><span class="dot math"></span>纯数学</button>
            <button class="filter-button" data-domain="cs"><span class="dot cs"></span>计算机科学</button>
            <button class="filter-button" data-domain="ai"><span class="dot ai"></span>人工智能</button>
          </div>
        </section>

        <section>
          <p class="eyebrow">培养方案图层</p>
          <select id="curriculumSelect" class="atlas-select" aria-label="选择培养方案图层"></select>
          <p id="curriculumDescription" class="section-note"></p>
        </section>

        <section>
          <p class="eyebrow">学习阶段</p>
          <div id="stageFilters" class="stage-grid"></div>
          <p class="section-note">第0层为初等基础，第8层为研究前沿；阶段不等于简单难度排名。</p>
        </section>

        <section>
          <p class="eyebrow">示例路线</p>
          <div id="pathButtons" class="path-stack"></div>
        </section>

        <section class="legend-card">
          <p class="eyebrow">节点类型</p>
          <div class="legend">
            <div><span class="legend-shape course"></span>课程级知识</div>
            <div><span class="legend-shape practice"></span>实践与规范</div>
            <div><span class="legend-shape frontier"></span>研究前沿</div>
            <div><span class="legend-shape external"></span>跨学科前置</div>
          </div>
        </section>

        <section class="status-card">
          <span class="status-pulse"></span>
          <div>
            <strong>知识图谱 v0.4</strong>
            <p><span id="catalogStats"></span><br /><span id="chunkStats"></span></p>
          </div>
        </section>
      </aside>

      <section class="map-panel" aria-label="交互式知识地图">
        <div class="map-toolbar">
          <div class="breadcrumb">完整知识图谱</div>
          <div class="toolbar-meta">
            <strong id="visibleCount">0 个节点</strong>
            <span>默认隐藏连线 · 点击节点显示准确依赖 · 拖动画布 · 滚轮缩放</span>
          </div>
          <div class="zoom-controls" aria-label="缩放控制">
            <button id="zoomOut" title="缩小">−</button>
            <button id="resetView" title="回到顶部视图">重置</button>
            <button id="zoomIn" title="放大">＋</button>
          </div>
        </div>

        <div id="mapViewport" class="map-viewport">
          <div id="atlasCanvas" class="atlas-canvas">
            <canvas id="edgeCanvas" class="edge-canvas" aria-hidden="true"></canvas>
            <div id="graphTransform" class="graph-transform"></div>
          </div>
          <div class="map-hint">点击节点显示必要前置、推荐关联与后续方向；未选中时不绘制关系线</div>
        </div>
      </section>

      <aside id="detailPanel" class="detail-panel" aria-label="节点详情">
        <button id="closeDetail" class="close-detail" aria-label="关闭详情">×</button>
        <div id="detailContent" class="detail-content">
          <div class="empty-detail">
            <span>◎</span>
            <h2>选择一个知识节点</h2>
            <p>点击任意知识节点，查看阶段、类型、前置依赖、核心内容和后续方向。</p>
          </div>
        </div>
      </aside>
    </main>
  </div>

  <template id="nodeDetailTemplate">
    <article>
      <div class="detail-heading">
        <span class="detail-domain"></span>
        <span class="detail-stage"></span>
        <span class="detail-type"></span>
      </div>
      <h1 class="detail-title"></h1>
      <p class="detail-cluster"></p>
      <p class="detail-summary"></p>

      <section>
        <h2>核心内容</h2>
        <ul class="detail-topics"></ul>
      </section>

      <section>
        <h2>必要前置</h2>
        <div class="detail-prerequisites chip-list"></div>
      </section>

      <section>
        <h2>推荐关联</h2>
        <div class="detail-recommended chip-list"></div>
      </section>

      <section>
        <h2>可继续进入</h2>
        <div class="detail-next chip-list"></div>
      </section>

      <button class="course-button">课程页面正在建设 <span>→</span></button>
      <p class="course-note">后续将补充章节、教材、公开课、习题、项目和完成标准。</p>
    </article>
  </template>

  <script src="./data/catalog.part1.js?v=20260806-0145"></script>
  <script src="./data/catalog.part2.js?v=20260806-0145"></script>
  <script src="./data/catalog.part3.js?v=20260806-0145"></script>
  <script src="./data/catalog.part4.js?v=20260806-0145"></script>
  <script src="./data/catalog.part5.js?v=20260806-0145"></script>
  <script src="./data/catalog.js?v=20260806-0145"></script>
  <script src="./edge-clarity.js?v=20260806-0145"></script>
  <script src="./app-v3.js?v=20260806-0145" defer></script>
</body>
</html>
